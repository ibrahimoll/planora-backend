name: Push Notification Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-push-notification-guard:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/planora_ci_placeholder
      JWT_SECRET_CODE: planora-ci-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      VERIFICATION_CODE_SECRET: planora-ci-verification-secret
      VERIFICATION_CODE_EXPIRE_MINUTES: "15"
      PASSWORD_RESET_CODE_SECRET: planora-ci-password-reset-secret
      PASSWORD_RESET_CODE_EXPIRE_MINUTES: "15"
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      EMAIL_FROM: ci@example.com
      GOOGLE_CLIENT_ID: ci-google-client-id
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run push notification import guard
        run: python -m pytest tests/test_00_push_notification_import_guard.py -q

      - name: Run push notification API tests
        if: env.TEST_DATABASE_URL != ''
        run: python -m pytest tests/test_18_push_notifications_api.py -q

      - name: Skip push notification API tests without database
        if: env.TEST_DATABASE_URL == ''
        run: echo "TEST_DATABASE_URL is not configured; skipping database-backed push notification API tests."
